name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov=exprand --cov-report=term-missing

  window:
    name: the window, on a virtual display
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install -e ".[dev]"
      - name: Test the window
        run: xvfb-run -a python -m pytest tests/test_gui.py -v
        env:
          EXPRAND_GUI_TESTS: "1"

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean environment and use it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/exprand --version
          /tmp/clean/bin/exprand init --dir /tmp/study --arms A,B --conditions c1,c2,c3 --rounds 2 --seed 1
          /tmp/clean/bin/exprand next --dir /tmp/study
          /tmp/clean/bin/exprand next --dir /tmp/study
          /tmp/clean/bin/exprand verify --dir /tmp/study
